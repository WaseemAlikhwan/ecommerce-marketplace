services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: marketplace_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - marketplace

  nginx:
    image: nginx:1.27-alpine
    container_name: marketplace_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - marketplace

  mysql:
    image: mysql:8.4
    container_name: marketplace_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-marketplace}
      MYSQL_USER: ${DB_USERNAME:-marketplace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PUBLISH_PORT:-3308}:3306"
    volumes:
      - marketplace_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - marketplace

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6380}:6379"
    networks:
      - marketplace

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: marketplace_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - marketplace

  mailpit:
    image: axllent/mailpit:latest
    container_name: marketplace_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - marketplace

networks:
  marketplace:
    driver: bridge

volumes:
  marketplace_mysql:
